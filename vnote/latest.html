<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Latest Voice Note</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;max-width:920px;margin:40px auto;padding:0 16px;line-height:1.55}
    article{padding:18px;border:1px solid rgba(0,0,0,.12);border-radius:16px}
  </style>
</head>
<body>
  <article id="content">Loading…</article>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('./latest.md?x=' + Date.now(), { cache: 'no-store' })
      .then(r => r.text())
      .then(md => document.getElementById('content').innerHTML = marked.parse(md))
      .catch(() => document.getElementById('content').textContent = 'Could not load latest.md');
  </script>
</body>
</html>
